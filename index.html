<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>diana.inkkk · Flashbook</title>
  <meta name="description" content="Tattoo flashbook by @diana.inkkk, Naples.">
  <meta name="theme-color" content="#161616">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <meta property="og:title" content="diana.inkkk · Flashbook">
  <meta property="og:description" content="Tattoo flashes by @diana.inkkk, Naples city center.">
  <meta property="og:image" content="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Gochi+Hand&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="brand">
    <img src="assets/logo.png" alt="" class="brand-logo">
    <div class="brand-name"><span id="brandHandle">@diana.inkkk</span> <em>flashbook</em></div>
  </header>

  <main id="stage" class="stage" aria-label="Flashbook">
    <div id="book" class="book">
      <div id="leftPage" class="page left" aria-live="polite"></div>
      <div id="rightPage" class="page right" aria-live="polite"></div>
      <div id="leafHost" class="leaf-host"></div>
      <nav id="tabs" class="tabs" aria-label="Chapters"></nav>
    </div>
  </main>

  <div class="nav">
    <button type="button" id="prevBtn" class="nav-btn prev" aria-label="Previous page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div id="pageLabel" class="page-label"></div>
    <button type="button" id="nextBtn" class="nav-btn next" aria-label="Next page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Flash detail" hidden>
    <button type="button" class="lb-close" id="lbClose" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="lb-inner">
      <figure class="lb-figure" id="lbFigure"></figure>
      <div class="lb-info">
        <div class="lb-chapter" id="lbChapter"></div>
        <h2 class="lb-title" id="lbTitle"></h2>
        <div class="lb-meta" id="lbMeta"></div>
        <p class="lb-notes" id="lbNotes"></p>
        <div class="lb-actions">
          <button type="button" class="lb-ar" id="lbAr">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>
            Provatelo addosso
          </button>
          <a class="lb-cta" id="lbCta" target="_blank" rel="noopener">Ask me about this flash</a>
        </div>
        <button type="button" class="lb-link" id="lbLink">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 10 18.7l1-1"/></svg>
          <span id="lbLinkText">Copia link per le storie</span>
        </button>
        <div class="lb-nav">
          <button type="button" class="nav-btn prev" id="lbPrev" aria-label="Previous flash"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div class="lb-pos" id="lbPos"></div>
          <button type="button" class="nav-btn next" id="lbNext" aria-label="Next flash"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
      </div>
    </div>
  </div>


  <div id="ar" class="ar" role="dialog" aria-modal="true" aria-label="Provatelo addosso" hidden>
    <div id="arStage" class="ar-stage">
      <video id="arVideo" class="ar-bg" autoplay playsinline muted></video>
      <img id="arPhoto" class="ar-bg" alt="" hidden>
      <img id="arArt" class="ar-art ink" alt="" draggable="false">
    </div>

    <div class="ar-top">
      <button type="button" class="ar-icon" id="arClose" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="ar-title" id="arTitle"></div>
    </div>
    <div class="ar-hint" id="arHint" aria-live="polite"></div>

    <div class="ar-msg" id="arMsg" hidden>
      <p id="arMsgText"></p>
      <label class="ar-btn solid">Scatta o carica una foto
        <input type="file" id="arFile" accept="image/*" capture="environment" hidden>
      </label>
      <button type="button" class="ar-btn" id="arRetry">Riprova con la fotocamera</button>
    </div>

    <div class="ar-panel">
      <div class="ar-sliders">
        <label><span>Dimensione</span><input type="range" id="arSize" min="10" max="160" value="45"></label>
        <label><span>Rotazione</span><input type="range" id="arRot" min="-180" max="180" value="0"></label>
      </div>
      <div class="ar-row">
        <button type="button" class="ar-btn ar-ink" id="arInk" aria-pressed="true">Effetto inchiostro</button>
        <button type="button" class="ar-shutter" id="arShutter" aria-label="Scatta la foto" disabled><span></span></button>
        <button type="button" class="ar-icon" id="arFlip" aria-label="Cambia fotocamera" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"/><path d="M4 20v-4.5h4.5"/></svg>
        </button>
      </div>
    </div>

    <div class="ar-result" id="arResult" hidden>
      <img id="arResultImg" alt="La tua foto con il flash">
      <div class="ar-row">
        <button type="button" class="ar-btn" id="arAgain">Rifai</button>
        <button type="button" class="ar-btn solid" id="arSave">Salva foto</button>
      </div>
      <div class="ar-note" id="arSaveNote"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/ar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
